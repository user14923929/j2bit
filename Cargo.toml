[package]
name = "j2bit"
version = "0.1.0"
edition = "2021"
description = "Java subset compiler for BBC micro:bit — transpiles Java to C++ (CODAL)"
authors = ["j2bit contributors"]
license = "MIT"
repository = "https://github.com/user14923929/j2bit"
keywords = ["microbit", "java", "compiler", "embedded", "codal"]
categories = ["compilers", "embedded"]

[[bin]]
name = "j2bit"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
anyhow = "=1.0.79"
thiserror = "=1.0.56"
colored = "=2.1.0"

[dev-dependencies]
pretty_assertions = "1"
